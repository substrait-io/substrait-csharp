name: Bug report
description: Report a reproducible problem in the Substrait C# library
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing a report. Do not report security vulnerabilities here.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example and the steps to run it.
      render: csharp
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package or commit version
      placeholder: "0.1.0-preview.1 or commit SHA"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: .NET SDK and runtime
      placeholder: ".NET SDK 10.0.400, .NET 10, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
