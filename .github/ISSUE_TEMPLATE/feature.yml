name: Feature request
description: Propose an improvement to the Substrait C# bindings
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or use case would this feature address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you propose.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternatives or workarounds you considered.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Describe public API, serialization, package, or implementation compatibility impacts.
    validations:
      required: true
