version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "nuget"
    directory: "/"
    groups:
      nuget-dependencies:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
