name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_PACKAGE_VERSION: 0.1.0-preview.${{ github.run_number }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Substrait.sln

      - name: Verify formatting
        run: dotnet format Substrait.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Substrait.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Substrait.sln --configuration Release --no-build --logger trx

      - name: Pack
        run: dotnet pack src/Substrait/Substrait.csproj --configuration Release --no-build --output artifacts/packages -p:PackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }}

      - name: Validate packages
        shell: pwsh
        run: >-
          ./eng/Validate-Package.ps1
          -PackagePath artifacts/packages/Microsoft.Substrait.${{ env.PREVIEW_PACKAGE_VERSION }}.nupkg
          -SymbolsPackagePath artifacts/packages/Microsoft.Substrait.${{ env.PREVIEW_PACKAGE_VERSION }}.snupkg
          -ExpectedVersion ${{ env.PREVIEW_PACKAGE_VERSION }}

      - name: Restore SBOM tool
        run: dotnet tool restore

      - name: Generate SBOM
        run: >-
          dotnet tool run sbom-tool generate
          -b artifacts/packages
          -bc src/Substrait
          -pn Microsoft.Substrait
          -pv ${{ env.PREVIEW_PACKAGE_VERSION }}
          -ps "Organization: Microsoft"
          -nsb https://github.com/microsoft/substrait-csharp
          -mi SPDX:2.2

      - name: Validate SBOM
        run: >-
          dotnet tool run sbom-tool validate
          -b artifacts/packages
          -o artifacts/sbom-validation.json
          -mi SPDX:2.2

      - name: Restore .NET 10 package smoke test
        run: dotnet restore tests/PackageSmokeTest/PackageSmokeTest.csproj -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} -p:SmokeTestTargetFramework=net10.0 --configfile tests/PackageSmokeTest/NuGet.Config --no-cache

      - name: Run .NET 10 package smoke test
        run: dotnet run --project tests/PackageSmokeTest/PackageSmokeTest.csproj --configuration Release --no-restore -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} -p:SmokeTestTargetFramework=net10.0

      - name: Restore .NET 9 package smoke test
        run: dotnet restore tests/PackageSmokeTest/PackageSmokeTest.csproj -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} -p:SmokeTestTargetFramework=net9.0 --configfile tests/PackageSmokeTest/NuGet.Config --no-cache

      - name: Run .NET 9 package smoke test
        run: dotnet run --project tests/PackageSmokeTest/PackageSmokeTest.csproj --configuration Release --no-restore -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} -p:SmokeTestTargetFramework=net9.0

      - name: Restore .NET 8 package smoke test
        run: dotnet restore tests/PackageSmokeTest/PackageSmokeTest.csproj -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} -p:SmokeTestTargetFramework=net8.0 --configfile tests/PackageSmokeTest/NuGet.Config --no-cache

      - name: Run .NET 8 package smoke test
        run: dotnet run --project tests/PackageSmokeTest/PackageSmokeTest.csproj --configuration Release --no-restore -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} -p:SmokeTestTargetFramework=net8.0

      - name: Restore .NET Framework package smoke test
        if: runner.os == 'Windows'
        run: dotnet restore tests/PackageSmokeTest/PackageSmokeTest.csproj -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} -p:SmokeTestTargetFramework=net462 --configfile tests/PackageSmokeTest/NuGet.Config --no-cache

      - name: Run .NET Framework package smoke test
        if: runner.os == 'Windows'
        run: dotnet run --project tests/PackageSmokeTest/PackageSmokeTest.csproj --configuration Release --no-restore -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} -p:SmokeTestTargetFramework=net462

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ runner.os }}
          path: |
            artifacts/packages/*.*nupkg
            artifacts/packages/_manifest/spdx_2.2/manifest.spdx.json
          if-no-files-found: error